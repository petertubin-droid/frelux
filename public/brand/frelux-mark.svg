<svg xmlns="http://www.w3.org/2000/svg" viewBox="132.88 77.8 246.24 356.4" role="img" aria-label="FRELUX">
  <!-- Transparent mark for light surfaces: the cantilever monogram carries the
       brand gradient itself and the orange rule stays as the accent, so no
       tile sits behind it and the artwork takes on the surface colour. The
       box is cropped to the artwork, so the gap between mark and wordmark is
       the layout gap rather than empty canvas. -->
  <defs>
    <linearGradient id="monogram" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#3B0B75"/>
    </linearGradient>
  </defs>
  <g transform="translate(-22.640 -38.840) scale(1.08)">
    <!-- Architectural Cantilever Monogram F -->
    <path d="M 144 108 L 372 108 L 338 178 L 222 178 L 222 230 L 320 230 L 286 294 L 222 294 L 222 398 L 144 398 Z" fill="url(#monogram)"/>
    <rect x="144" y="412" width="228" height="26" rx="13" fill="#F97316"/>
  </g>
</svg>
