# Codecov configuration for FRELUX
# https://docs.codecov.com/docs/codecov-yaml

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: auto
        threshold: 5%
        informational: true

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false

ignore:
  - "src/test/**"
  - "**/*.d.ts"
  - "src/**/*.test.ts"
  - "src/**/*.test.tsx"
