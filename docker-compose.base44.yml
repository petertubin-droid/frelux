# Base44 dev environment — runs the FRELUX Vite dev server from source.
# Edits to the repo are picked up live via Vite HMR (no image rebuild needed).
services:
  web:
    image: node:20-alpine
    working_dir: /app
    # Bind-mount the cloned source so edits are reflected live.
    volumes:
      - ./:/app
      # Keep container-installed node_modules isolated from the host.
      - node_modules:/app/node_modules
    ports:
      - "3000:5173"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  node_modules:
