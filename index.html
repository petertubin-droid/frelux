    <!-- Google AdSense (Auto ads). The tag sits in the served source so AdSense
         can verify the site and attach automatic ads. Requests start paused and
         are only unpaused for a visitor who answered the cookie banner and is
         not a paid subscriber (src/lib/ad-gate.ts, src/lib/ad-consent.ts), so
         nothing is requested or served on an unanswered visit. -->
    <script>
      (function () {
        window.adsbygoogle = window.adsbygoogle || [];
        window.adsbygoogle.pauseAdRequests = 1;
        try {
          var raw = localStorage.getItem("frelux_cookie_consent");
          if (!raw) return;
          var stored = JSON.parse(raw);
          var fresh =
            stored &&
            typeof stored.timestamp === "number" &&
            Date.now() - stored.timestamp < 180 * 24 * 60 * 60 * 1000;
          if (!stored || stored.version !== 2 || !fresh || !stored.categories)
            return;
          window.adsbygoogle.requestNonPersonalizedAds =
            stored.categories.advertising === true ? 0 : 1;
        } catch (error) {
          /* private mode: the page code pauses requests again on mount */
        }
      })();
    </script>
    <!-- Ad script is attached after first paint (or on first interaction).
         On a slow connection it used to compete with the app bundle for a
         narrow pipe and delay the first screen. -->
    <script>
      (function () {
        var loaded = false;
        function loadAds() {
          if (loaded) return;
          loaded = true;
          var s = document.createElement("script");
          s.async = true;
          s.crossOrigin = "anonymous";
          s.src =
            "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3404100134534192";
          document.head.appendChild(s);
        }
        ["pointerdown", "keydown", "touchstart", "scroll"].forEach(function (evt) {
          window.addEventListener(evt, loadAds, { once: true, passive: true });
        });
        window.addEventListener("load", function () {
          if ("requestIdleCallback" in window) {
            requestIdleCallback(loadAds, { timeout: 2500 });
          } else {
            setTimeout(loadAds, 1200);
          }
        });
      })();
    </script>
