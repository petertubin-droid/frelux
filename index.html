    <!-- Theme detection: must run before paint to prevent FOUC -->
    <script>
      (function(){var t=localStorage.getItem('theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}if(t==='dark'){document.documentElement.classList.add('dark');}})();

    <meta charset="UTF-8" />
    <!-- Google AdSense (Auto ads). The tag sits in the served source so AdSense
         can verify the site and attach automatic ads. Requests start paused and
         are only unpaused for a visitor who answered the cookie banner and is
         not a paid subscriber (src/lib/ad-gate.ts, src/lib/ad-consent.ts), so
         nothing is requested or served on an unanswered visit. -->
    <script>
      (function () {
        window.adsbygoogle = window.adsbygoogle || [];
        window.adsbygoogle.pauseAdRequests = 1;
        try {
          var raw = localStorage.getItem("frelux_cookie_consent");
          if (!raw) return;
          var stored = JSON.parse(raw);
          var fresh =
            stored &&
            typeof stored.timestamp === "number" &&
            Date.now() - stored.timestamp < 180 * 24 * 60 * 60 * 1000;
          if (!stored || stored.version !== 2 || !fresh || !stored.categories)
            return;
          window.adsbygoogle.requestNonPersonalizedAds =
            stored.categories.advertising === true ? 0 : 1;
        } catch (error) {
          /* private mode: the page code pauses requests again on mount */
        }
      })();
    </script>
    <!-- The loader has to be in the served source for AdSense to verify the

         ad. Deferring the download looked cheaper on paper but would have
         traded the whole verification for one request. -->
