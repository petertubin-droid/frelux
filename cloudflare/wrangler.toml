# FRELUX file Worker: presigned R2 uploads/downloads plus public object serving.
# Secrets are NOT stored here. Set them once with:
#   npx wrangler secret put R2_ACCOUNT_ID
#   npx wrangler secret put R2_ACCESS_KEY_ID
#   npx wrangler secret put R2_SECRET_ACCESS_KEY
#   npx wrangler secret put SUPABASE_JWT_SECRET

name = "frelux-files"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# freluxtools.com is delegated to Cloudflare (anahi/garrett.ns.cloudflare.com) and
# the Worker already answers on its custom domain, so the route is declared here
# rather than left for a future zone move:
#   GET https://files.freluxtools.com/health -> {"service":"frelux-files",...}
# VITE_R2_WORKER_URL points at that hostname.
routes = [{ pattern = "files.freluxtools.com", custom_domain = true }]
# api.freluxtools.com is bound to this same Worker (Workers Custom Domain, DNS
# resolving) but its edge certificate had not issued when checked on 2026-11-12:
# TLS to the hostname resets while the files host serves normally. Until it
# serves, new endpoints belong under a path on the files host rather than a new
# hostname. Add the route here once GET /health answers on it.
workers_dev = true

[observability]
enabled = true

[vars]
# Public values, the same ones the browser bundle ships. The Worker uses them to
# verify tokens against Supabase when no signing secret is configured.
SUPABASE_URL = "https://nfgaaohweygwydoelxnf.supabase.co"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5mZ2Fhb2h3ZXlnd3lkb2VseG5mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2MDc0MDYsImV4cCI6MjA5ODE4MzQwNn0.5ebLSj0RZBfdT_GEZ5Sf_qN_uNh2RUzJQlnuIXGCdXI"
ALLOWED_ORIGINS = "https://freluxtools.com,https://www.freluxtools.com,http://localhost:5173"
PUBLIC_BASE_URL = "https://files.freluxtools.com"
# Edge API vars. TURNSTILE_HOSTNAMES is an allowlist, so an empty value fails closed.
TURNSTILE_HOSTNAMES = "freluxtools.com,www.freluxtools.com"

[[r2_buckets]]
binding = "BUCKET_AVATARS"
bucket_name = "frelux-avatars"

[[r2_buckets]]
binding = "BUCKET_BRAND_ASSETS"
bucket_name = "frelux-brand-assets"

[[r2_buckets]]
binding = "BUCKET_MARKETPLACE"
bucket_name = "frelux-marketplace"

[[r2_buckets]]
binding = "BUCKET_PLAN_DOCUMENTS"
bucket_name = "frelux-plan-documents"

[[r2_buckets]]
binding = "BUCKET_PRO_VERIFICATION"
bucket_name = "frelux-pro-verification"
