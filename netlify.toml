[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # These VITE_-prefixed vars are intentionally bundled into the client-side
  # JS output (that's how Vite env vars work). VITE_SUPABASE_ANON_KEY is
  # Supabase's public anon key — safe to expose, access is enforced by RLS.
  # VITE_OPENWEATHER_API_KEY / VITE_SITE_URL are also client-facing by design.
  # Without this, Netlify's secret scanner flags them as "exposed secrets"
  # in the build output, which fails the build.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_ANON_KEY,VITE_SUPABASE_URL,VITE_OPENWEATHER_API_KEY,VITE_SITE_URL,VITE_PAYSTACK_PUBLIC_KEY"


# 301 redirects — consolidated calculator routes
[[redirects]]
  from = "/cost-estimator"
  to = "/paint-calculator?mode=cost"
  status = 301
  force = true

[[redirects]]
  from = "/painting-estimator"
  to = "/paint-calculator?mode=room-estimate"
  status = 301
  force = true

[[redirects]]
  from = "/screeding-cost-estimator"
  to = "/screeding-calculator?mode=cost"
  status = 301
  force = true

[[redirects]]
  from = "/pop-ceiling-cost-estimator"
  to = "/pop-ceiling-calculator?mode=cost"
  status = 301
  force = true

[[redirects]]
  from = "/tile-cost-estimator"
  to = "/tile-calculator?mode=cost"
  status = 301
  force = true

[[redirects]]
  from = "/tyrolene-estimator"
  to = "/finish-estimator?mode=tyrolene"
  status = 301
  force = true

# 404 page — return real 404 for unknown routes
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# SPA routing — fallback for known routes that don't have prerendered HTML
# This only fires if no static file matches (prerendered pages are found first)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-XSS-Protection = "1; mode=block"
    X-Permitted-Cross-Domain-Policies = "none"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://*.sentry.io https://*.sentry-cdn.com https://connect.facebook.net https://pagead2.googlesyndication.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co https://*.sentry.io https://*.sentry-cdn.com wss://*.supabase.co https://www.google-analytics.com https://api.openweathermap.org https://api.paystack.co; frame-src 'self' https://googleads.g.doubleclick.net https://standard.paystack.co; object-src 'none'; base-uri 'self'; form-action 'self' https://paystack.com https://standard.paystack.co"

# Static assets — long cache (immutable, 1 year)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML — short cache so new deployments reach users quickly
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Service worker — no cache
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"


# Fonts — long cache (immutable, content-hashed filenames)
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# OG image — moderate cache
[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
