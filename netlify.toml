# Conventional asset paths that DO NOT exist in this build. The SPA
# fallback previously served index.html (text/html) with status 200 for
# /service-worker.js and /asset-manifest.json — a real service worker is
# registered at /sw.js, so these requests (stale PWAs, scanners, tooling
# expecting the conventional names) must get an honest 404, never HTML.
[[redirects]]
  from = "/service-worker.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/asset-manifest.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/precache-manifest.json"
  to = "/404.html"
  status = 404
  force = true

# SPA fallback — all routes serve index.html so React Router can handle
# client-side routing (including the 404 NotFound component for unknown routes).
# This must come AFTER specific redirects but BEFORE any catch-all 404 rule.
# Removed the old "/* -> /404.html status=404" redirect because:
#   1. No prerendered 404.html exists in the build output
#   2. It fired before the SPA fallback, showing a Netlify error screen
#   3. React Router already renders a proper <NotFound /> component for unknown routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), interest-cohort=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-XSS-Protection = "1; mode=block"
    X-Permitted-Cross-Domain-Policies = "none"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://translate.google.com https://translate.googleapis.com https://www.googletagmanager.com https://*.sentry.io https://*.sentry-cdn.com https://connect.facebook.net https://pagead2.googlesyndication.com https://contextual.media.net https://m.servedby-buysellads.com https://cdn.taboola.com https://widgets.outbrain.com https://*.profitabledisplaynetwork.com https://*.highperformanceformat.com https://*.highrevenueformat.com https://*.profitablecpmrate.com https://*.profitableratecpmnetwork.com https://*.adsterrapremium.com https://assets.revcontent.com https://serve.monumetric.com https://cdn.snigelweb.com https://srv.carbonads.net https://media.ethicalads.io https://c.amazon-adsystem.com https://cdn.yllix.net https://*.monetag.com https://propropsl.com https://quge5.com https://*.quge5.com https://omg10.com https://*.omg10.com https://6opo.com https://n6wxm.com https://*.n6wxm.com https://vaimucuvikuwu.net https://tpc.googlesyndication.com https://www.googletagservices.com https://highperformanceformat.com https://highrevenueformat.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://translate.googleapis.com https://www.gstatic.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://translate.google.com https://translate.googleapis.com https://translate-pa.googleapis.com https://nominatim.openstreetmap.org https://*.supabase.co https://*.sentry.io https://*.sentry-cdn.com wss://*.supabase.co https://www.google-analytics.com https://api.openweathermap.org https://api.paystack.co https://quge5.com https://*.quge5.com https://omg10.com https://*.omg10.com https://6opo.com https://n6wxm.com https://*.n6wxm.com https://vaimucuvikuwu.net https://e2ertt.com https://pagead2.googlesyndication.com https://tpc.googlesyndication.com https://googleads.g.doubleclick.net https://*.highperformanceformat.com https://*.highrevenueformat.com https://*.profitablecpmrate.com https://*.profitableratecpmnetwork.com https://*.adsterrapremium.com https://highrevenueformat.com https://*.profitabledisplaynetwork.com; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self' https://paystack.com https://standard.paystack.co"

# Static assets — long cache (immutable, 1 year)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML — short cache so new deployments reach users quickly
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Service worker — no cache
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"


# Fonts — long cache (immutable, content-hashed filenames)
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# Favicons and manifest — moderate cache
[[headers]]
  for = "/favicon-*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Static images — moderate cache
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# OG image — moderate cache
[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"


# Sitemap: dynamic function shadows the stale static public/sitemap.xml
# (force=true is required because a static file exists at the same path).
# robots.txt already points crawlers at this URL.
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

# Learn library split: /learn used to host the full paginated article
# dump; that listing now lives at /learn/library. Forward the old
# query-parameterized URLs so indexed pages land on the new listing.
[[redirects]]
  from = "/learn"
  query = { page = ":p" }
  to = "/learn/library?page=:p"
  status = 301
  force = true
