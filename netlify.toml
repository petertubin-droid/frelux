  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), interest-cohort=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-XSS-Protection = "1; mode=block"
    X-Permitted-Cross-Domain-Policies = "none"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://translate.google.com https://translate.googleapis.com https://www.googletagmanager.com https://*.sentry.io https://*.sentry-cdn.com https://connect.facebook.net https://pagead2.googlesyndication.com https://contextual.media.net https://m.servedby-buysellads.com https://cdn.taboola.com https://widgets.outbrain.com https://*.profitabledisplaynetwork.com https://*.highperformanceformat.com https://*.highrevenueformat.com https://*.profitablecpmrate.com https://*.profitableratecpmnetwork.com https://*.adsterrapremium.com https://assets.revcontent.com https://serve.monumetric.com https://cdn.snigelweb.com https://srv.carbonads.net https://media.ethicalads.io https://c.amazon-adsystem.com https://cdn.yllix.net https://*.monetag.com https://propropsl.com https://quge5.com https://*.quge5.com https://omg10.com https://*.omg10.com https://6opo.com https://n6wxm.com https://*.n6wxm.com https://vaimucuvikuwu.net https://tpc.googlesyndication.com https://www.googletagservices.com https://highperformanceformat.com https://highrevenueformat.com https://openairtowhardworking.com https://*.openairtowhardworking.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://translate.googleapis.com https://www.gstatic.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://translate.google.com https://translate.googleapis.com https://translate-pa.googleapis.com https://nominatim.openstreetmap.org https://*.supabase.co https://*.sentry.io https://*.sentry-cdn.com wss://*.supabase.co https://www.google-analytics.com https://api.openweathermap.org https://api.paystack.co https://quge5.com https://*.quge5.com https://omg10.com https://*.omg10.com https://6opo.com https://n6wxm.com https://*.n6wxm.com https://vaimucuvikuwu.net https://e2ertt.com https://pagead2.googlesyndication.com https://tpc.googlesyndication.com https://g