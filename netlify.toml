[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # These VITE_-prefixed vars are intentionally bundled into the client-side
  # JS output (that's how Vite env vars work). VITE_SUPABASE_ANON_KEY is
  # Supabase's public anon key — safe to expose, access is enforced by RLS.
  # VITE_OPENWEATHER_API_KEY / VITE_SITE_URL are also client-facing by design.
  # Without this, Netlify's secret scanner flags them as "exposed secrets"
  # in the build output, which fails the build.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_ANON_KEY,VITE_SUPABASE_URL,VITE_OPENWEATHER_API_KEY,VITE_SITE_URL,VITE_PAYSTACK_PUBLIC_KEY,TERMLII_SENDER_ID,TERMII_SENDER_ID,VITE_TERMII_SENDER_ID"
  # TERMII_SENDER_ID (Termii SMS sender ID) is not a real credential — it's
  # a public display name shown in every SMS ("FRELUX"), which also happens
  # to be the project's own brand name used throughout the codebase (CSS,
  # types, docs). That coincidence made Netlify's scanner flag hundreds of
  # unrelated files as "leaking" it. Omitted here (both spellings, in case
  # the Netlify dashboard var has a typo vs. the code's TERMII_SENDER_ID).
  # supabase/migrations and supabase/functions are Deno/SQL files deployed
  # separately via the Supabase CLI — Netlify never builds or ships them.
  # They only reference secrets via Deno.env.get()/env vars (never hardcoded),
  # but Netlify's secret scanner checks the whole repo checkout, not just
  # the publish dir, so it flags false positives there. Skip them.
  SECRETS_SCAN_OMIT_PATHS = "supabase/migrations,supabase/functions"


# Staging environment — deploy previews and branch deploys
[context.deploy-preview]
  command = "npm run build"
  publish = "dist"

[context.deploy-preview.environment]
  VITE_SENTRY_ENVIRONMENT = "staging"


# 301 redirects — consolidated calculator routes
[[redirects]]
  from = "/cost-estimator"
  to = "/paint-calculator?mode=cost"
  status = 301
  force = true

[[redirects]]
  from = "/painting-estimator"
  to = "/paint-calculator?mode=room-estimate"
  status = 301
  force = true

[[redirects]]
  from = "/screeding-cost-estimator"
  to = "/screeding-calculator?mode=cost"
  status = 301
  force = true

[[redirects]]
  from = "/pop-ceiling-cost-estimator"
  to = "/pop-ceiling-calculator?mode=cost"
  status = 301
  force = true

[[redirects]]
  from = "/tile-cost-estimator"
  to = "/tile-calculator?mode=cost"
  status = 301
  force = true

[[redirects]]
  from = "/tyrolene-estimator"
  to = "/finish-estimator?mode=tyrolene"
  status = 301
  force = true

# SPA fallback — all routes serve index.html so React Router can handle
# client-side routing (including the 404 NotFound component for unknown routes).
# This must come AFTER specific redirects but BEFORE any catch-all 404 rule.
# Removed the old "/* -> /404.html status=404" redirect because:
#   1. No prerendered 404.html exists in the build output
#   2. It fired before the SPA fallback, showing a Netlify error screen
#   3. React Router already renders a proper <NotFound /> component for unknown routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-XSS-Protection = "1; mode=block"
    X-Permitted-Cross-Domain-Policies = "none"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://*.sentry.io https://*.sentry-cdn.com https://connect.facebook.net https://pagead2.googlesyndication.com https://contextual.media.net https://m.servedby-buysellads.com https://cdn.taboola.com https://widgets.outbrain.com https://*.profitabledisplaynetwork.com https://highperformanceformat.com https://*.highperformanceformat.com https://assets.revcontent.com https://serve.monumetric.com https://cdn.snigelweb.com https://srv.carbonads.net https://media.ethicalads.io https://c.amazon-adsystem.com https://cdn.yllix.net https://*.monetag.com https://propropsl.com https://quge5.com https://*.quge5.com https://omg10.com https://*.omg10.com https://6opo.com https://vaimucuvikuwu.net https://tpc.googlesyndication.com https://www.googletagservices.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co https://*.sentry.io https://*.sentry-cdn.com wss://*.supabase.co https://www.google-analytics.com https://api.openweathermap.org https://api.paystack.co https://quge5.com https://*.quge5.com https://omg10.com https://*.omg10.com https://6opo.com https://vaimucuvikuwu.net https://e2ertt.com https://pagead2.googlesyndication.com https://tpc.googlesyndication.com https://googleads.g.doubleclick.net; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self' https://paystack.com https://standard.paystack.co"

# Static assets — long cache (immutable, 1 year)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML — short cache so new deployments reach users quickly
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Service worker — no cache
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"


# Fonts — long cache (immutable, content-hashed filenames)
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# Favicons and manifest — moderate cache
[[headers]]
  for = "/favicon-*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Static images — moderate cache
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# OG image — moderate cache
[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
