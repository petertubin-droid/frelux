# ── Locale URL architecture (i18n batch, 2026-10-23) ───────────────────
# HISTORY: locale-prefixed URLs (/es/..., /fr/...) were previously
# 301-redirected to the English canonical. That fixed Search Console's
# "Duplicate page, Google chose different canonical" reports — but it
# also destroyed URL durability: shared links, bookmarks and refreshes
# lost the locale, and the client-side language architecture
# (App.tsx LocaleAwareRoutes + LanguageProvider, URL locale wins on
# boot) could never be exercised from a full page load.
#
# NEW DESIGN: locale prefixes serve 200 (the prerendered English page,
# URL preserved) while a server-side X-Robots-Tag: noindex header
# (public/_headers) keeps them out of the index. noindex is STRONGER
# than the canonical that produced the original GSC duplicate reports:
# the pages cannot be indexed at all, so the duplicate-content problem
# cannot return. The client boots on /fr/paint-calculator, renders the
# page in French (dictionary chrome + Google Translate for content),
# and seo.ts independently sets noindex client-side for locale pages.
# /en stays a 301 to / because English is the default origin — the
# prefix adds nothing.
#
# Order matters: these rules must stay ABOVE the SPA fallback below.

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/:path/index.html"
  to = "/:path/"
  status = 301
  force = true

[[redirects]]
  from = "/:path/:sub/index.html"
  to = "/:path/:sub/"
  status = 301
  force = true

[[redirects]]
  from = "/en"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/en/*"
  to = "/:splat"
  status = 301
  force = true


